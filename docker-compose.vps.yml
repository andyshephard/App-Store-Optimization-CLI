# Deployment onto the existing n8n VPS, where Caddy already owns 80/443.
#
# Differences from docker-compose.yml (which is self-contained for local use):
#   - no Caddy service; the existing n8n-docker-caddy stack proxies this
#   - joins that stack's network so Caddy and n8n can reach it by name
#   - runs a prebuilt image rather than building, because the box has 2GB RAM
#     shared with n8n and whatever else the host runs (check `docker stats`
#     there before changing memory limits; this file does not know)
#
#   docker compose -f docker-compose.vps.yml up -d
services:
  asocli:
    image: asocli:latest
    container_name: asocli
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: [.env]
    environment:
      ASO_DASHBOARD_HOST: "0.0.0.0"
      ASO_DASHBOARD_PORT: "3456"
      ASO_OPEN_BROWSER: "0"
      ASO_DISABLE_UPDATE_CHECK: "1"
      ASO_DISABLE_CREDENTIAL_STORE: "1"
      ASO_SUPPORTED_COUNTRIES: "US,GB,CA,AU,IE,NZ,DE,FR,ES,IT,PT,VN"
      ASO_PRIMARY_APP_ID: "${ASO_PRIMARY_APP_ID}"
      # Apple throttles the app-detail endpoint per storefront; keep bursts small.
      # This caps keywords in flight AND app lookups per keyword, so 2 means at
      # most 4 app-page requests at once (3 meant 9).
      ASO_KEYWORD_ENRICHMENT_CONCURRENCY: "2"
      # A throttle now pauses every request to the host (see aso-apple-client),
      # so a third attempt is cheap and turns most 429/403s into successes.
      ASO_RETRY_MAX_ATTEMPTS: "3"
      # Pause between 25-keyword batches inside a storefront (default 5s).
      ASO_REFRESH_INTER_BATCH_DELAY_MS: "15000"
      # Without this V8 sizes the heap from the 512m cgroup (~256MB), and a
      # cold-cache crawl hit that limit on 2026-09-25. 384 left only ~128MB
      # under mem_limit for everything outside the V8 heap - better-sqlite3,
      # TLS and socket buffers, code space - so RSS could reach the cgroup
      # limit with the heap still "fine". 320 keeps the heap above the 256MB
      # the cold crawl needed and gives native memory ~192MB. Each refresh
      # batch now logs rssMb/heapUsedMb; if heapUsedMb nears 320, raise
      # mem_limit to 768m (and this to 448) rather than raising this alone.
      NODE_OPTIONS: "--max-old-space-size=320"
      # 60s between storefronts. Measured 2026-07-28: a full forced crawl of 12
      # storefronts does only ~152s of actual work, so pacing dominates. Kept at
      # 60s rather than tuned to the edge because the runs that set this were on
      # warm app-doc caches; those expire every 168h, and on a cold day each
      # storefront fetches several times more requests - which is the case the
      # pacing exists for.
      ASO_REFRESH_INTER_COUNTRY_DELAY_MS: "60000"
      # The app owns its own clock: it refreshes daily at this wall-clock time
      # and writes straight to SQLite, so the data is current whether or not
      # anything calls the API.
      ASO_REFRESH_DAILY_AT: "04:00"
      ASO_REFRESH_TIMEZONE: "Europe/Prague"
      # A scheduled run interrupted by a restart is re-run once on startup; at
      # most this many catch-ups per 24h, so a crawl that kills the process
      # cannot crash-loop. 0 disables the catch-up.
      ASO_REFRESH_MAX_CATCHUPS_PER_DAY: "2"
    volumes:
      - aso-data:/home/node/.aso
    # No ports. Caddy reaches this over the shared network as http://asocli:3456,
    # and so does n8n. Publishing a port would bypass UFW, since Docker writes
    # its own iptables rules.
    expose: ["3456"]
    # Docker's default json-file driver never rotates: logs grew unbounded.
    # 3 x 10 MB caps this container's logs at 30 MB on disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [n8n]
    # A crawl must never be able to starve n8n on a 2GB box.
    mem_limit: 512m
    memswap_limit: 768m

volumes:
  aso-data:

networks:
  n8n:
    external: true
    name: n8n-docker-caddy_default
